<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Permisos para reproducción automática de audio -->
<meta http-equiv="Permissions-Policy" content="autoplay=(self), microphone=(), camera=(), speaker=(self)">
<meta name="referrer" content="no-referrer">
<title>Shop – Undercover Cuffs</title>
<style>
    :root {
        color-scheme: dark;
    }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #f4f4f4;
    }
    .lock-wrapper {
        text-align: center;
    }
    .lock-icon {
        width: 160px;
        max-width: 60vw;
    }
    .lock-text {
        margin-top: 24px;
        font-size: 1.25rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }
    
    @media only screen and (max-width: 768px) {
        .lock-icon {
            width: 120px;
            max-width: 50vw;
        }
        
        .lock-text {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            margin-top: 20px;
            padding: 0 20px;
        }
        
        body {
            padding: 20px;
        }
    }
    
    @media only screen and (max-width: 480px) {
        .lock-icon {
            width: 100px;
            max-width: 45vw;
        }
        
        .lock-text {
            font-size: clamp(0.8rem, 4vw, 1rem);
            margin-top: 15px;
            padding: 0 15px;
        }
        
        body {
            padding: 15px;
        }
    }
    
</style>
</head>
<body>
    <div class="lock-wrapper">
        <svg class="lock-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lockTitle lockDesc">
            <title id="lockTitle">Lock</title>
            <desc id="lockDesc">Lock indicating protected shop</desc>
            <path d="M32 10a12 12 0 0 1 12 12v8h-6v-8a6 6 0 0 0-12 0v8h-6v-8A12 12 0 0 1 32 10z" fill="#ffb500"/>
            <rect x="14" y="26" width="36" height="30" rx="6" fill="#ff7a00"/>
            <circle cx="32" cy="41" r="5" fill="#220003"/>
            <rect x="30" y="41" width="4" height="8" rx="2" fill="#220003"/>
        </svg>
        <p class="lock-text">Under Construction</p>
    </div>
    
    <script>
        // Sistema de reproducción de música de fondo - SOLUCIÓN ROBUSTA PARA MÓVILES
        (function() {
            'use strict';
            
            const audio = document.getElementById('background-audio');
            if (!audio) {
                return;
            }
            
            // Configurar audio para móviles
            audio.volume = 0.3;
            audio.muted = false;
            
            // CRÍTICO para iOS: establecer playsinline mediante JavaScript también
            if ('playsInline' in audio) {
                audio.playsInline = true;
            }
            audio.setAttribute('playsinline', 'true');
            audio.setAttribute('webkit-playsinline', 'true');
            
            let musicPlaying = false;
            let userInteracted = false;
            let audioReady = false;
            
            // Detectar si es un dispositivo móvil
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                            ('ontouchstart' in window) || 
                            (navigator.maxTouchPoints > 0);
            
            // Solicitar permisos de audio explícitamente
            function requestAudioPermissions() {
                // Intentar solicitar permisos de autoplay
                if ('permissions' in navigator && 'query' in navigator.permissions) {
                    // Permisos de autoplay
                    navigator.permissions.query({ name: 'autoplay' }).then(function(result) {
                        if (result.state === 'granted') {
                            console.log('✅ Permisos de autoplay concedidos');
                        } else if (result.state === 'prompt') {
                            console.log('⚠️ Permisos de autoplay pendientes');
                        } else {
                            console.log('❌ Permisos de autoplay denegados');
                        }
                    }).catch(function(error) {
                        console.log('ℹ️ API de permisos de autoplay no disponible');
                    });
                    
                    // Intentar solicitar permisos de speaker/audio si está disponible
                    try {
                        navigator.permissions.query({ name: 'speaker-selection' }).then(function(result) {
                            if (result.state === 'granted') {
                                console.log('✅ Permisos de audio/speaker concedidos');
                            }
                        }).catch(function(error) {
                            // Esta API puede no estar disponible en todos los navegadores
                        });
                    } catch (e) {
                        // La API puede no existir
                    }
                }
                
                // Solicitar permisos de audio mediante el contexto de audio (Web Audio API)
                if (window.AudioContext || window.webkitAudioContext) {
                    try {
                        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                        var audioContext = new AudioContextClass();
                        
                        // Si el contexto está suspendido, intentar reanudarlo
                        if (audioContext.state === 'suspended') {
                            audioContext.resume().then(function() {
                                console.log('✅ Contexto de audio activado');
                            }).catch(function(error) {
                                console.log('⚠️ No se pudo activar el contexto de audio:', error);
                            });
                        }
                        
                        // Cerrar el contexto después de usarlo
                        setTimeout(function() {
                            if (audioContext && audioContext.close) {
                                audioContext.close().catch(function() {});
                            }
                        }, 100);
                    } catch (e) {
                        console.log('ℹ️ Web Audio API no disponible');
                    }
                }
            }
            
            // Solicitar permisos al cargar la página
            requestAudioPermissions();
            
            // También solicitar permisos cuando el usuario interactúe
            var permissionsRequested = false;
            function requestPermissionsOnInteraction() {
                if (!permissionsRequested) {
                    permissionsRequested = true;
                    requestAudioPermissions();
                }
            }
            
            // Solicitar permisos en la primera interacción
            document.addEventListener('click', requestPermissionsOnInteraction, { once: true });
            document.addEventListener('touchstart', requestPermissionsOnInteraction, { once: true });
            document.addEventListener('keydown', requestPermissionsOnInteraction, { once: true });
            
            // Función robusta para reproducir música
            function playMusic(force) {
                if (!audioReady && !force) {
                    return;
                }
                
                // Si ya está reproduciéndose, no hacer nada
                if (musicPlaying && !audio.paused && !audio.ended) {
                    return;
                }
                
                // Asegurar que no esté muted
                audio.muted = false;
                
                // Intentar reproducir
                const playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise
                        .then(function() {
                            musicPlaying = true;
                            audio.muted = false;
                            console.log('✅ Música reproduciéndose');
                        })
                        .catch(function(error) {
                            if (isMobile && !userInteracted) {
                                console.log('⚠️ Autoplay bloqueado en móvil. La música se activará al tocar la pantalla.');
                            }
                        });
                }
            }
            
            // Función para iniciar música en interacción (MUY AGRESIVA para móviles)
            function startMusicOnInteraction(e) {
                if (musicPlaying && !audio.paused) {
                    return;
                }
                
                // Marcar interacción
                if (!userInteracted) {
                    userInteracted = true;
                    console.log('👆 Usuario interactuó - Iniciando música...');
                }
                
                // Asegurar que el audio esté listo
                if (!audioReady) {
                    audio.load();
                    audioReady = true;
                }
                
                // Forzar reproducción inmediata
                audio.muted = false;
                
                // En móviles, intentar múltiples veces
                if (isMobile) {
                    // Intento inmediato
                    playMusic(true);
                    
                    // Intentos con delays para asegurar
                    var attempts = [10, 50, 100, 200, 300, 500, 800, 1000];
                    attempts.forEach(function(delay) {
                        setTimeout(function() {
                            if (!musicPlaying || audio.paused) {
                                audio.muted = false;
                                playMusic(true);
                            }
                        }, delay);
                    });
                } else {
                    playMusic(true);
                }
            }
            
            // Listener único y global para capturar CUALQUIER interacción
            function setupGlobalListener() {
                var handler = function(e) {
                    startMusicOnInteraction(e);
                };
                
                // Eventos críticos para móviles (sin 'once' para capturar múltiples veces)
                var events = ['touchstart', 'touchend', 'click', 'scroll', 'wheel', 'mousedown', 'keydown'];
                
                events.forEach(function(eventType) {
                    // Capturar en fase de captura (más temprano)
                    document.addEventListener(eventType, handler, { capture: true, passive: true });
                    window.addEventListener(eventType, handler, { capture: true, passive: true });
                    
                    if (document.body) {
                        document.body.addEventListener(eventType, handler, { capture: true, passive: true });
                    }
                });
            }
            
            // Cuando el audio esté listo
            function onAudioReady() {
                audioReady = true;
                console.log('🎵 Audio listo para reproducir');
                
                if (userInteracted || !isMobile) {
                    playMusic(true);
                }
            }
            
            // Event listeners para cuando el audio esté cargado
            audio.addEventListener('canplay', onAudioReady, { once: false });
            audio.addEventListener('canplaythrough', onAudioReady, { once: false });
            audio.addEventListener('loadeddata', function() {
                audioReady = true;
                if (userInteracted || !isMobile) {
                    setTimeout(function() { playMusic(true); }, 100);
                }
            }, { once: false });
            
            // Cargar el audio
            audio.load();
            
            // Configurar listeners INMEDIATAMENTE
            setupGlobalListener();
            
            // También configurar cuando el DOM esté listo
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    setupGlobalListener();
                    setTimeout(function() {
                        if (userInteracted || !isMobile) {
                            playMusic(true);
                        }
                    }, 500);
                });
            } else {
                setTimeout(function() {
                    if (userInteracted || !isMobile) {
                        playMusic(true);
                    }
                }, 500);
            }
            
            // Cuando la página cargue completamente
            window.addEventListener('load', function() {
                audioReady = true;
                setTimeout(function() {
                    if (userInteracted || !isMobile) {
                        playMusic(true);
                    }
                }, 800);
            }, { once: true });
            
            // Manejar cuando el audio termine (reiniciar loop)
            audio.addEventListener('ended', function() {
                audio.currentTime = 0;
                if (userInteracted || musicPlaying) {
                    audio.play().catch(function() {});
                }
            });
            
            // Mantener la música reproduciéndose si se pausa
            audio.addEventListener('pause', function() {
                if (userInteracted && !audio.ended) {
                    setTimeout(function() {
                        if (audio.paused && userInteracted) {
                            audio.muted = false;
                            audio.play().catch(function() {});
                        }
                    }, 200);
                }
            });
            
            // Verificar periódicamente el estado (más frecuente en móviles)
            var checkInterval = isMobile ? 300 : 1000;
            setInterval(function() {
                if (userInteracted && audioReady) {
                    if (audio.paused && !audio.ended) {
                        audio.muted = false;
                        audio.play()
                            .then(function() {
                                musicPlaying = true;
                            })
                            .catch(function() {});
                    }
                    // Si la música terminó, reiniciar
                    if (musicPlaying && audio.ended) {
                        audio.currentTime = 0;
                        audio.muted = false;
                        audio.play().catch(function() {});
                    }
                }
            }, checkInterval);
            
            // En móviles, listeners adicionales
            if (isMobile) {
                // Cuando la página vuelva a estar visible
                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden && userInteracted && audioReady) {
                        setTimeout(function() {
                            audio.muted = false;
                            playMusic(true);
                        }, 200);
                    }
                });
                
                // Cuando cambie la orientación
                window.addEventListener('orientationchange', function() {
                    setTimeout(function() {
                        if (userInteracted && audioReady) {
                            audio.muted = false;
                            playMusic(true);
                        }
                    }, 500);
                });
                
                // Intentar reproducir después de que el usuario haga cualquier acción
                window.addEventListener('focus', function() {
                    if (userInteracted && audioReady) {
                        setTimeout(function() {
                            audio.muted = false;
                            playMusic(true);
                        }, 200);
                    }
                });
            }
            
            // Debugging
            audio.addEventListener('error', function(e) {
                console.error('❌ Error al cargar el audio:', e);
                if (audio.error) {
                    console.log('Código:', audio.error.code, 'Mensaje:', audio.error.message);
                }
            });
            
            audio.addEventListener('loadedmetadata', function() {
                console.log('✅ Metadata cargada. Duración:', audio.duration, 's');
            });
            
            audio.addEventListener('play', function() {
                console.log('▶️ Música iniciada');
                musicPlaying = true;
            });
            
            audio.addEventListener('playing', function() {
                console.log('🎵 Música reproduciéndose');
                musicPlaying = true;
            });
            
            if (isMobile) {
                console.log('📱 Dispositivo móvil detectado. Toca la pantalla para activar la música.');
            }
        })();
    </script>
</body>
</html>
