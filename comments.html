<!doctype html>

<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">	
<meta charset="UTF-8">
<!-- Permisos para reproducción automática de audio -->
<meta http-equiv="Permissions-Policy" content="autoplay=(self), microphone=(), camera=(), speaker=(self)">
<meta name="referrer" content="no-referrer">
	
<title>Comments - Undercover Cuffs</title>
	
<link href="css/UndercoverCuffs.css" rel="stylesheet" type="text/css">
	
    <style>
        /* Estructura de página para footer al final */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            flex-shrink: 0;
        }
        
        #seccion-comentarios {
            flex: 1;
            min-height: 0;
        }
        
        footer {
            margin-top: auto;
            padding: 30px 0;
            text-align: center;
            color: #666;
            font-size: 16px;
            width: 100%;
            flex-shrink: 0;
        }
        
        /* Estilos para garabatos animados */
        .doodles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .doodle {
            position: absolute;
            opacity: 0.5;
        }
        
        .doodle svg {
            width: clamp(30px, 5vw, 60px);
            height: clamp(30px, 5vw, 60px);
        }
        
        /* Garabatos flotando desde abajo */
        .doodle.float-up {
            animation: floatUp 15s infinite ease-in-out;
        }
        
        .doodle.float-up:nth-child(1) { left: 5%; animation-duration: 12s; animation-delay: 0s; }
        .doodle.float-up:nth-child(2) { left: 15%; animation-duration: 18s; animation-delay: 2s; }
        .doodle.float-up:nth-child(3) { left: 25%; animation-duration: 16s; animation-delay: 4s; }
        .doodle.float-up:nth-child(4) { left: 35%; animation-duration: 20s; animation-delay: 1s; }
        .doodle.float-up:nth-child(5) { left: 45%; animation-duration: 14s; animation-delay: 3s; }
        .doodle.float-up:nth-child(6) { left: 55%; animation-duration: 17s; animation-delay: 5s; }
        .doodle.float-up:nth-child(7) { left: 65%; animation-duration: 19s; animation-delay: 2.5s; }
        .doodle.float-up:nth-child(8) { left: 75%; animation-duration: 15s; animation-delay: 0.5s; }
        .doodle.float-up:nth-child(9) { left: 85%; animation-duration: 21s; animation-delay: 3.5s; }
        .doodle.float-up:nth-child(10) { left: 95%; animation-duration: 13s; animation-delay: 1.5s; }
        
        /* Garabatos flotando desde la izquierda */
        .doodle.float-right {
            animation: floatRight 20s infinite ease-in-out;
            top: 20%;
        }
        
        .doodle.float-right:nth-child(11) { top: 10%; animation-duration: 18s; animation-delay: 0s; }
        .doodle.float-right:nth-child(12) { top: 25%; animation-duration: 22s; animation-delay: 3s; }
        .doodle.float-right:nth-child(13) { top: 40%; animation-duration: 16s; animation-delay: 1s; }
        .doodle.float-right:nth-child(14) { top: 55%; animation-duration: 24s; animation-delay: 4s; }
        .doodle.float-right:nth-child(15) { top: 70%; animation-duration: 19s; animation-delay: 2s; }
        .doodle.float-right:nth-child(16) { top: 85%; animation-duration: 21s; animation-delay: 5s; }
        
        /* Garabatos flotando desde la derecha */
        .doodle.float-left {
            animation: floatLeft 20s infinite ease-in-out;
            top: 30%;
            right: 0;
            left: auto;
        }
        
        .doodle.float-left:nth-child(17) { top: 15%; animation-duration: 17s; animation-delay: 1s; }
        .doodle.float-left:nth-child(18) { top: 35%; animation-duration: 23s; animation-delay: 3.5s; }
        .doodle.float-left:nth-child(19) { top: 50%; animation-duration: 15s; animation-delay: 0.5s; }
        .doodle.float-left:nth-child(20) { top: 65%; animation-duration: 20s; animation-delay: 4s; }
        .doodle.float-left:nth-child(21) { top: 80%; animation-duration: 18s; animation-delay: 2s; }
        
        /* Garabatos flotando desde arriba */
        .doodle.float-down {
            animation: floatDown 18s infinite ease-in-out;
            top: -50px;
        }
        
        .doodle.float-down:nth-child(22) { left: 12%; animation-duration: 16s; animation-delay: 0s; }
        .doodle.float-down:nth-child(23) { left: 28%; animation-duration: 19s; animation-delay: 2s; }
        .doodle.float-down:nth-child(24) { left: 44%; animation-duration: 21s; animation-delay: 4s; }
        .doodle.float-down:nth-child(25) { left: 60%; animation-duration: 17s; animation-delay: 1s; }
        .doodle.float-down:nth-child(26) { left: 76%; animation-duration: 20s; animation-delay: 3s; }
        .doodle.float-down:nth-child(27) { left: 92%; animation-duration: 18s; animation-delay: 5s; }
        
        /* Garabatos rotando en posiciones fijas */
        .doodle.rotate-fixed {
            animation: rotateFixed 8s infinite linear;
        }
        
        .doodle.rotate-fixed:nth-child(28) { top: 5%; left: 8%; animation-duration: 10s; }
        .doodle.rotate-fixed:nth-child(29) { top: 5%; right: 8%; animation-duration: 12s; }
        .doodle.rotate-fixed:nth-child(30) { bottom: 5%; left: 8%; animation-duration: 9s; }
        .doodle.rotate-fixed:nth-child(31) { bottom: 5%; right: 8%; animation-duration: 11s; }
        .doodle.rotate-fixed:nth-child(32) { top: 50%; left: 2%; animation-duration: 13s; }
        .doodle.rotate-fixed:nth-child(33) { top: 50%; right: 2%; animation-duration: 10s; }
        
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes floatRight {
            0% {
                transform: translateX(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) rotate(-360deg);
                opacity: 0;
            }
        }
        
        @keyframes floatLeft {
            0% {
                transform: translateX(100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateX(calc(-100vw - 100px)) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes floatDown {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) rotate(-360deg);
                opacity: 0;
            }
        }
        
        @keyframes rotateFixed {
            from {
                transform: rotate(0deg) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: rotate(180deg) scale(1.1);
                opacity: 0.6;
            }
            to {
                transform: rotate(360deg) scale(1);
                opacity: 0.4;
            }
        }
        
        .doodle svg {
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        
        /* Estilos para la sección de comentarios */
        .comentarios-section {
            max-width: 1200px;
            width: 95%;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        
        .comentarios-section h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 15px;
            text-align: center;
            color: #333;
        }
        
        .comentarios-section .miss-heed-text {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            text-align: center;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 30px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border-radius: 10px;
            border-left: 4px solid #667eea;
            animation: fadeIn 0.5s ease-in;
        }
        
        .comentario-form {
            margin-bottom: 30px;
        }
        
        .comentario-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        
        .comentario-input:focus {
            outline: none;
            border-color: #74b9ff;
        }
        
        .btn-enviar {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            display: block;
            margin: 0 auto;
        }
        
        .btn-enviar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(116, 185, 255, 0.4);
        }
        
        .btn-enviar:active {
            transform: translateY(0);
        }
        
        .lista-comentarios {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .comentario-item {
            background: #f8f9fa;
            padding: 20px;
            margin-bottom: 0;
            border-radius: 10px;
            border-left: 4px solid #74b9ff;
            animation: fadeIn 0.3s ease-in;
            transition: all 0.3s ease;
            word-wrap: break-word;
            overflow-wrap: break-word;
            position: relative;
            padding-right: 20px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
        
        .comentario-item.eliminando {
            animation: fadeOut 0.3s ease-out forwards;
        }
        
        .comentario-texto {
            font-size: 16px;
            line-height: 1.6;
            color: #333;
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
            margin-bottom: 10px;
            padding-right: 40px;
        }
        
        .comentario-fecha {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
            padding-right: 40px;
        }
        
        /* Botón de eliminar comentario */
        
        .btn-eliminar {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        
        .btn-eliminar:hover {
            background: #ff4757;
            transform: scale(1.1);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
        }
        
        .btn-eliminar:active {
            transform: scale(0.95);
        }
        
        /* Mostrar botones de eliminar solo cuando el modo admin esté activo */
        body.modo-admin .btn-eliminar {
            display: flex;
        }
        
        body.modo-admin .comentario-item {
            padding-right: 50px;
        }
        
        /* Botón de modo admin */
        .admin-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .btn-admin {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn-admin:active {
            transform: translateY(0);
        }
        
        .btn-admin.activo {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }
        
        .btn-admin.activo:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }
        
        /* Modal de contraseña */
        .modal-contraseña {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-contraseña.mostrar {
            display: flex;
        }
        
        .modal-contraseña-contenido {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: modalPop 0.3s ease-out;
        }
        
        @keyframes modalPop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .modal-contraseña h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5rem;
        }
        
        .modal-contraseña input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        
        .modal-contraseña input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .modal-contraseña-botones {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .modal-contraseña-botones button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-cancelar {
            background: #ddd;
            color: #333;
        }
        
        .btn-cancelar:hover {
            background: #ccc;
        }
        
        .btn-confirmar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-confirmar:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
        }
        
        .error-mensaje {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: -15px;
            margin-bottom: 15px;
            display: none;
        }
        
        .error-mensaje.mostrar {
            display: block;
        }
        
        @media only screen and (max-width: 768px) {
            footer {
                padding: 20px 0;
            }
        }
        
        /* Aviso de censura */
        .aviso-censura {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f, #ff4757);
            color: white;
            padding: 40px 60px;
            border-radius: 25px;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: bold;
            text-align: center;
            box-shadow: 0 15px 50px rgba(255, 71, 87, 0.6), 
                        0 5px 20px rgba(0, 0, 0, 0.5),
                        inset 0 2px 10px rgba(255, 255, 255, 0.3);
            z-index: 10000;
            border: 6px solid #fff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5),
                         0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
        }
        
        .aviso-censura.show {
            animation: censuraPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards,
                       censuraShake 0.15s ease-in-out 0.7s infinite;
            opacity: 1;
        }
        
        .aviso-censura::before {
            content: "🚫";
            display: block;
            font-size: 4em;
            margin-bottom: 15px;
        }
        
        .aviso-censura.show::before {
            animation: censuraIconSpin 0.8s ease-in-out 0.2s,
                       censuraIconBounce 0.4s ease-in-out 1s infinite;
        }
        
        .aviso-censura::after {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 30px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f, #ff4757, #ff6b6b);
            background-size: 400% 400%;
            z-index: -1;
            opacity: 0;
            filter: blur(10px);
        }
        
        .aviso-censura.show::after {
            opacity: 0.8;
            animation: censuraGlow 2s ease infinite,
                       censuraRotate 3s linear infinite;
        }
        
        @keyframes censuraPop {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-180deg);
                opacity: 0;
            }
            60% {
                transform: translate(-50%, -50%) scale(1.15) rotate(10deg);
                opacity: 1;
            }
            80% {
                transform: translate(-50%, -50%) scale(0.95) rotate(-5deg);
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        
        @keyframes censuraShake {
            0%, 100% {
                transform: translate(-50%, -50%) translateX(0);
            }
            25% {
                transform: translate(-50%, -50%) translateX(-8px) rotate(2deg);
            }
            75% {
                transform: translate(-50%, -50%) translateX(8px) rotate(-2deg);
            }
        }
        
        @keyframes censuraIconSpin {
            0% {
                transform: rotate(0deg) scale(0.5);
            }
            50% {
                transform: rotate(180deg) scale(1.3);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }
        
        @keyframes censuraIconBounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-15px) scale(1.1);
            }
        }
        
        @keyframes censuraGlow {
            0%, 100% {
                background-position: 0% 50%;
                opacity: 0.7;
            }
            50% {
                background-position: 100% 50%;
                opacity: 1;
            }
        }
        
        @keyframes censuraRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .aviso-censura.hide {
            animation: censuraHide 0.4s ease-in forwards;
        }
        
        @keyframes censuraHide {
            0% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1) rotate(180deg);
                opacity: 0.5;
            }
            100% {
                transform: translate(-50%, -50%) scale(0) rotate(360deg);
                opacity: 0;
            }
        }
        
        @media only screen and (max-width: 768px) {
            .comentarios-section {
                max-width: 98%;
                width: 98%;
                margin: 20px auto;
                padding: 20px;
            }
            
            .comentarios-section h2 {
                font-size: clamp(1.3rem, 5vw, 2rem);
                margin-bottom: 12px;
            }
            
            .comentarios-section .miss-heed-text {
                font-size: clamp(0.9rem, 2.5vw, 1.1rem);
                padding: 12px;
                margin-bottom: 20px;
                line-height: 1.4;
            }
            
            .comentario-form {
                margin-bottom: 20px;
            }
            
            .comentario-input {
                padding: 12px;
                font-size: 16px;
                min-height: 120px;
                margin-bottom: 12px;
            }
            
            .btn-enviar {
                padding: 12px 24px;
                font-size: 15px;
                width: 100%;
                max-width: 300px;
            }
            
            .lista-comentarios {
                margin-top: 20px;
                gap: 12px;
            }
            
            .comentario-item {
                padding: 15px;
                margin-bottom: 0;
            }
            
            .comentario-texto {
                font-size: 15px;
                line-height: 1.5;
                padding-right: 35px;
                margin-bottom: 8px;
            }
            
            .comentario-fecha {
                font-size: 11px;
                padding-right: 35px;
            }
            
            .btn-eliminar {
                width: 28px;
                height: 28px;
                font-size: 18px;
                top: 8px;
                right: 8px;
            }
            
            body.modo-admin .comentario-item {
                padding-right: 45px;
            }
            
            .aviso-censura {
                padding: 20px 25px;
                font-size: 1.1rem;
                max-width: 90%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
            
            header {
                padding: 0 5px;
            }
            
            header h1 {
                font-size: clamp(1.2rem, 5vw, 2rem) !important;
                padding: 8px 15px;
                margin: 5px;
            }
            
            .navmenu {
                gap: 8px;
                flex-direction: column;
            }
            
            .navmenu li {
                width: 100%;
            }
            
            .navmenu a {
                display: block;
                padding: 8px 15px;
                font-size: clamp(0.85rem, 3vw, 1rem);
            }
            
            .admin-controls {
                top: 10px;
                right: 10px;
            }
            
            .btn-admin {
                padding: 8px 15px;
                font-size: 12px;
            }
            
            .modal-contraseña-contenido {
                padding: 20px;
                max-width: 90%;
            }
            
            footer {
                padding: 20px 0;
                font-size: clamp(1rem, 3vw, 1.6rem);
            }
        }
        
        @media only screen and (max-width: 480px) {
            .comentarios-section {
                max-width: 100%;
                width: 100%;
                margin: 15px auto;

<script>
    // Sistema de reproducción de música de fondo - SOLUCIÓN ROBUSTA PARA MÓVILES
    (function() {
        'use strict';
        
        const audio = document.getElementById('background-audio');
        if (!audio) {
            return;
        }
        
        // Configurar audio para móviles
        audio.volume = 0.3;
        audio.muted = false;
        
        // CRÍTICO para iOS: establecer playsinline mediante JavaScript también
        if ('playsInline' in audio) {
            audio.playsInline = true;
        }
        audio.setAttribute('playsinline', 'true');
        audio.setAttribute('webkit-playsinline', 'true');
        
        let musicPlaying = false;
        let userInteracted = false;
        let audioReady = false;
        
        // Detectar si es un dispositivo móvil
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                        ('ontouchstart' in window) || 
                        (navigator.maxTouchPoints > 0);
        
        // Solicitar permisos de audio explícitamente
        function requestAudioPermissions() {
            // Intentar solicitar permisos de autoplay
            if ('permissions' in navigator && 'query' in navigator.permissions) {
                // Permisos de autoplay
                navigator.permissions.query({ name: 'autoplay' }).then(function(result) {
                    if (result.state === 'granted') {
                        console.log('✅ Permisos de autoplay concedidos');
                    } else if (result.state === 'prompt') {
                        console.log('⚠️ Permisos de autoplay pendientes');
                    } else {
                        console.log('❌ Permisos de autoplay denegados');
                    }
                }).catch(function(error) {
                    console.log('ℹ️ API de permisos de autoplay no disponible');
                });
                
                // Intentar solicitar permisos de speaker/audio si está disponible
                try {
                    navigator.permissions.query({ name: 'speaker-selection' }).then(function(result) {
                        if (result.state === 'granted') {
                            console.log('✅ Permisos de audio/speaker concedidos');
                        }
                    }).catch(function(error) {
                        // Esta API puede no estar disponible en todos los navegadores
                    });
                } catch (e) {
                    // La API puede no existir
                }
            }
            
            // Solicitar permisos de audio mediante el contexto de audio (Web Audio API)
            if (window.AudioContext || window.webkitAudioContext) {
                try {
                    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    var audioContext = new AudioContextClass();
                    
                    // Si el contexto está suspendido, intentar reanudarlo
                    if (audioContext.state === 'suspended') {
                        audioContext.resume().then(function() {
                            console.log('✅ Contexto de audio activado');
                        }).catch(function(error) {
                            console.log('⚠️ No se pudo activar el contexto de audio:', error);
                        });
                    }
                    
                    // Cerrar el contexto después de usarlo
                    setTimeout(function() {
                        if (audioContext && audioContext.close) {
                            audioContext.close().catch(function() {});
                        }
                    }, 100);
                } catch (e) {
                    console.log('ℹ️ Web Audio API no disponible');
                }
            }
        }
        
        // Solicitar permisos al cargar la página
        requestAudioPermissions();
        
        // También solicitar permisos cuando el usuario interactúe
        var permissionsRequested = false;
        function requestPermissionsOnInteraction() {
            if (!permissionsRequested) {
                permissionsRequested = true;
                requestAudioPermissions();
            }
        }
        
        // Solicitar permisos en la primera interacción
        document.addEventListener('click', requestPermissionsOnInteraction, { once: true });
        document.addEventListener('touchstart', requestPermissionsOnInteraction, { once: true });
        document.addEventListener('keydown', requestPermissionsOnInteraction, { once: true });
        
        // Función robusta para reproducir música
        function playMusic(force) {
            if (!audioReady && !force) {
                return;
            }
            
            // Si ya está reproduciéndose, no hacer nada
            if (musicPlaying && !audio.paused && !audio.ended) {
                return;
            }
            
            // Asegurar que no esté muted
            audio.muted = false;
            
            // Intentar reproducir
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise
                    .then(function() {
                        musicPlaying = true;
                        audio.muted = false;
                        console.log('✅ Música reproduciéndose');
                    })
                    .catch(function(error) {
                        if (isMobile && !userInteracted) {
                            console.log('⚠️ Autoplay bloqueado en móvil. La música se activará al tocar la pantalla.');
                        }
                    });
            }
        }
        
        // Función para iniciar música en interacción (MUY AGRESIVA para móviles)
        function startMusicOnInteraction(e) {
            if (musicPlaying && !audio.paused) {
                return;
            }
            
            // Marcar interacción
            if (!userInteracted) {

            var events = ['touchstart', 'touchend', 'click', 'scroll', 'wheel', 'mousedown', 'keydown'];
            
            events.forEach(function(eventType) {
                // Capturar en fase de captura (más temprano)
                document.addEventListener(eventType, handler, { capture: true, passive: true });
                window.addEventListener(eventType, handler, { capture: true, passive: true });

        }, checkInterval);
        
        // En móviles, listeners adicionales
        if (isMobile) {

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, audioContext.currentTime);
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.4);
                } catch (e) {
                    console.error('Error en fallback de audio:', e);
                }
            }
        }
        
        // Función para mostrar aviso de censura
        function mostrarAvisoCensura() {
            // Remover cualquier aviso anterior
            const avisoAnterior = document.getElementById('aviso-censura');
            if (avisoAnterior) {
                avisoAnterior.remove();
            }
            
            // Crear el elemento de aviso
            const aviso = document.createElement('div');
            aviso.id = 'aviso-censura';
            aviso.className = 'aviso-censura';
            aviso.textContent = '¡PALABRA CENSURADA!';
            document.body.appendChild(aviso);
            
            // Reproducir sonido de bocina
            sonidoBocinaPayaso();
            
            // Usar requestAnimationFrame para asegurar que el DOM esté actualizado
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    aviso.classList.add('show');
                });
            });
            
            // Ocultar el aviso después de 2.5 segundos
            setTimeout(() => {
                aviso.classList.remove('show');
                aviso.classList.add('hide');
                setTimeout(() => {
                    if (aviso.parentNode) {
                        aviso.parentNode.removeChild(aviso);
                    }
                }, 400);
            }, 2500);
        }
        
        // Función para censurar palabras
        function censurarTexto(texto, mostrarAviso = true) {
            let textoCensurado = texto;
            let palabraCensurada = false;
            
            // Ordenar palabras por longitud (más largas primero) para evitar censurar partes de palabras compuestas
            const palabrasOrdenadas = [...palabrasCensuradas].sort((a, b) => b.length - a.length);
            
            // Normalizar todas las palabras de la lista
            const palabrasNormalizadas = palabrasOrdenadas.map(p => ({
                original: p,
                normalizada: normalizarPalabra(p),
                tieneEspacios: p.includes(' ')
            }));
            
            palabrasNormalizadas.forEach(({ original, normalizada, tieneEspacios }) => {
                if (tieneEspacios) {
                    // Para frases, buscar directamente en el texto
                    const palabraEscapada = original.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(palabraEscapada.replace(/\s+/g, '\\s+'), 'gi');
                    const matches = textoCensurado.match(regex);
                    
                    if (matches && matches.length > 0) {
                        palabraCensurada = true;
                        textoCensurado = textoCensurado.replace(regex, (match) => '*'.repeat(match.length));
                    }
                } else {
                    // Para palabras individuales, usar expresión regular con límites de palabra
                    // Escapar caracteres especiales
                    const palabraEscapada = original.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    
                    // Primero intentar con la palabra original (con acentos)
                    const regex = new RegExp(`\\b${palabraEscapada}\\b`, 'gi');
                    if (regex.test(textoCensurado)) {
                        palabraCensurada = true;
                        textoCensurado = textoCensurado.replace(regex, (match) => '*'.repeat(match.length));
                    }
                    
                    // También buscar palabra normalizada (sin acentos) comparando palabra por palabra
                    // Dividir texto en palabras usando expresión regular que respete límites de palabra
                    const palabrasTexto = textoCensurado.split(/\b/);
                    
                    palabrasTexto.forEach((palabraTexto, index) => {
                        // Solo procesar si es una palabra (no espacios ni puntuación)
                        if (palabraTexto.trim() && /^[a-zA-ZáéíóúÁÉÍÓÚàèìòùÀÈÌÒÙâêîôûÂÊÎÔÛäëïöüÄËÏÖÜãõÃÕçÇñÑ]+$/.test(palabraTexto)) {
                            const palabraTextoNormalizada = normalizarPalabra(palabraTexto);
                            
                            // Comparar palabras normalizadas (sin acentos)
                            if (palabraTextoNormalizada === normalizada) {
                                palabraCensurada = true;
                                palabrasTexto[index] = '*'.repeat(palabraTexto.length);
                            }
                        }
                    });
                    
                    // Reconstruir el texto
                    textoCensurado = palabrasTexto.join('');
                }
            });
            
            // Si se encontró una palabra censurada, mostrar aviso
            if (palabraCensurada && mostrarAviso) {
                mostrarAvisoCensura();
            }
            
            return textoCensurado;
        }
        
        // Función para agregar comentario
        function agregarComentario() {
            const input = document.getElementById('comentario-input');
            const textoOriginal = input.value.trim();
            
            if (textoOriginal === '') {
                alert('Por favor, escribe un comentario.');
                return;
            }
            
            // Censurar el texto
            const textoCensurado = censurarTexto(textoOriginal);
            
            // Generar ID único para el comentario
            const comentarioId = comentarioIdCounter++;
            const fechaISO = new Date().toISOString();
            
            // Crear elemento de comentario
            crearElementoComentario(comentarioId, textoCensurado, fechaISO, true);
            
            // Guardar en localStorage
            guardarComentarios();
            
            // Limpiar el input
            input.value = '';
        }
        
        // Función para actualizar visibilidad de botones de eliminar
        function actualizarBotonesEliminar() {
            // Los botones se muestran/ocultan automáticamente mediante CSS cuando 
            // se agrega/quita la clase 'modo-admin' al body
            // Esta función está aquí por si necesitamos hacer algo adicional en el futuro
        }
        
        // Inicializar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            const btnEnviar = document.getElementById('btn-enviar');
            const inputComentario = document.getElementById('comentario-input');
            const btnAdmin = document.getElementById('btn-admin');
            const modalContraseña = document.getElementById('modal-contraseña');
            const btnConfirmar = document.getElementById('btn-confirmar');
            const btnCancelar = document.getElementById('btn-cancelar');
            const inputContraseña = document.getElementById('input-contraseña');
            
            // Cargar comentarios guardados
            cargarComentarios();
            
            // Verificar si el modo admin ya está activo
            if (esModoAdmin()) {
                activarModoAdmin();
            }
            
            // Event listener para el botón de admin
            if (btnAdmin) {
                btnAdmin.addEventListener('click', function() {
                    if (esModoAdmin()) {
                        // Si ya está en modo admin, desactivar
                        if (confirm('¿Deseas desactivar el modo administrador?')) {
                            desactivarModoAdmin();
                        }
                    } else {
                        // Si no está en modo admin, mostrar modal
                        mostrarModalContraseña();
                    }
                });
            }
            
            // Event listener para el botón de confirmar
            if (btnConfirmar) {
                btnConfirmar.addEventListener('click', function() {
                    autenticarAdmin();
                });
            }
            
            // Event listener para el botón de cancelar
            if (btnCancelar) {
                btnCancelar.addEventListener('click', function() {
                    ocultarModalContraseña();
                });
            }
            
            // Event listener para la tecla Enter en el input de contraseña
            if (inputContraseña) {
                inputContraseña.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        autenticarAdmin();
                    }
                    // Cerrar con Escape
                    if (e.key === 'Escape') {
                        ocultarModalContraseña();
                    }
                });
            }
            
            // Cerrar el modal al hacer clic fuera de él
            if (modalContraseña) {
                modalContraseña.addEventListener('click', function(e) {
                    if (e.target === modalContraseña) {
                        ocultarModalContraseña();
                    }
                });
            }
            
            // Event listeners para comentarios
            if (btnEnviar && inputComentario) {
                // Enviar comentario al hacer clic en el botón
                btnEnviar.addEventListener('click', agregarComentario);
                
                // Enviar comentario al presionar Ctrl+Enter o Cmd+Enter
                inputComentario.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        agregarComentario();
                    }
                });
            }
        });
    })();

</script>
