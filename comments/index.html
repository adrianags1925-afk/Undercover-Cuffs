<body>
<div class="noise-layer" aria-hidden="true"></div>
<div class="spotlight" aria-hidden="true"></div>
<header class="site-header" data-scrolled="false">
  <a class="brand" href="../index.html" aria-label="Inicio de Undercover Cuffs">
    <img src="../assets/img/new-logo.png" alt="Logo de Undercover Cuffs">

  <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>

<main>
  <section class="page-hero section-reveal"><p class="eyebrow">Comunidad</p><h1>Comentarios</h1><p>Deja una teoría, una reacción o una pista sobre el proyecto.</p></section>

    <form class="comment-form">

      <button class="btn primary" type="submit">Publicar</button>
    </form>
    <div class="comment-list" aria-live="polite"></div>
  </section>

<footer class="site-footer">
  <p>Undercover Cuffs · Proyecto narrativo en desarrollo</p>

</footer>
<div class="lightbox" aria-hidden="true">
